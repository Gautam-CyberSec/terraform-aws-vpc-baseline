name: Bug report
description: Something does not behave the way the documentation says it should
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Please redact account IDs, ARNs, bucket names and IP addresses before
        pasting any output.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you expected, and what you got instead.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Configuration
      description: The module block or variables that trigger it.
      render: hcl
    validations:
      required: true

  - type: textarea
    id: output
    attributes:
      label: Terraform output
      description: The error, redacted.
      render: shell

  - type: input
    id: terraform-version
    attributes:
      label: Terraform version
      placeholder: "1.15.8"
    validations:
      required: true

  - type: input
    id: provider-version
    attributes:
      label: AWS provider version
      placeholder: "5.70.0"

  - type: input
    id: region
    attributes:
      label: Region
      placeholder: "ap-south-1"
