name: Feature request
description: Suggest something this baseline should support
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve
      description: The situation where the module falls short today.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed interface
      description: How it would look from a caller's perspective.
      render: hcl

  - type: dropdown
    id: cost
    attributes:
      label: Does this create billable AWS resources?
      options:
        - "No"
        - "Yes — and it should default to disabled"
        - "Not sure"
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
