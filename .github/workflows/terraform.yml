name: Terraform

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# No AWS credentials are configured anywhere in this workflow. Everything it runs
# is static analysis, so it never touches an account and cannot create resources.
permissions:
  contents: read

jobs:
  validate:
    name: fmt · validate · tflint
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        directory:
          - .
          - examples/minimal
          - examples/complete

    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.8"
          terraform_wrapper: false

      - name: Check formatting
        if: matrix.directory == '.'
        run: terraform fmt -recursive -check -diff

      - name: Initialise without a backend
        working-directory: ${{ matrix.directory }}
        run: terraform init -backend=false -input=false

      - name: Validate
        working-directory: ${{ matrix.directory }}
        run: terraform validate -no-color

  tflint:
    name: tflint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: v0.64.0

      - name: Cache tflint plugins
        uses: actions/cache@v4
        with:
          path: ~/.tflint.d/plugins
          key: tflint-${{ hashFiles('.tflint.hcl') }}

      - run: tflint --init
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - run: tflint --recursive --format compact

  docs:
    name: terraform-docs up to date
    runs-on: ubuntu-latest

    # The terraform-docs GitHub Action is deliberately not used here: it runs its
    # own container image and passes CLI flags that override .terraform-docs.yml,
    # so the output never matches what `make docs` produces locally and the drift
    # check fails on every commit. Installing a pinned binary and running the same
    # make target keeps CI byte-identical to a developer's machine.
    env:
      TERRAFORM_DOCS_VERSION: v0.24.0

    steps:
      - uses: actions/checkout@v4

      - name: Install terraform-docs
        run: |
          curl -sSLo /tmp/terraform-docs.tar.gz \
            "https://terraform-docs.io/dl/${TERRAFORM_DOCS_VERSION}/terraform-docs-${TERRAFORM_DOCS_VERSION}-linux-amd64.tar.gz"
          tar -xzf /tmp/terraform-docs.tar.gz -C /tmp terraform-docs
          install -m 0755 /tmp/terraform-docs /usr/local/bin/terraform-docs
          terraform-docs --version

      - name: Check the committed tables match the code
        run: make docs-check
